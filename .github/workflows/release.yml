name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute version tags
        id: v
        run: |
          # The `v*.*.*` trigger glob is looser than it looks — `*` matches any character
          # except `/`, so it would happily accept a tag carrying shell metacharacters.
          # Re-validate as strict semver before the value is used anywhere downstream.
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to release from non-semver tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          V="${GITHUB_REF_NAME#v}"          # v1.2.3 -> 1.2.3
          echo "full=$V"        >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}"  >> "$GITHUB_OUTPUT"   # 1.2
          echo "major=${V%%.*}" >> "$GITHUB_OUTPUT"   # 1

      - name: Build and push
        env:
          GAR: europe-west3-docker.pkg.dev/niecke-it/niecke-it/uptime
          HUB: docker.io/niecke11/uptime
          # Step outputs go through env, never spliced straight into the script body.
          FULL: ${{ steps.v.outputs.full }}
          MINOR: ${{ steps.v.outputs.minor }}
          MAJOR: ${{ steps.v.outputs.major }}
        run: |
          docker build \
            --build-arg BUILD_GIT_HASH="$(git rev-parse --short HEAD)" \
            --build-arg BUILD_VERSION="$FULL" \
            -t "$GAR:$FULL"  -t "$HUB:$FULL" \
            -t "$GAR:$MINOR" -t "$HUB:$MINOR" \
            -t "$GAR:$MAJOR" -t "$HUB:$MAJOR" \
            -t "$GAR:latest" -t "$HUB:latest" .
          docker push --all-tags "$GAR"
          docker push --all-tags "$HUB"
