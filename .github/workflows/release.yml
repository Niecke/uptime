name: Release

# release-please tags vX.Y.Z when its release pull request merges. That merge is
# the release decision; this workflow carries it out. It never builds: the image
# was built once on the release pull request, tested there, and retagged
# sha-<short> by promote.yml when it merged. Here it gets its version tags on
# Artifact Registry and Docker Hub.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  # write: editing the GitHub Release body.
  contents: write

# Releases are never cancelled: a half-moved set of registry tags is worse than
# a queued run.
concurrency:
  group: release
  cancel-in-progress: false

env:
  GAR: europe-west3-docker.pkg.dev/niecke-it/niecke-it/uptime
  HUB: docker.io/niecke11/uptime

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # The floating tags only ever move forward. Re-running the workflow for an
      # older tag, or a patch cut for an older line, still gets its own X.Y.Z
      # tag but must not drag `latest` back to it.
      - name: Resolve the release
        id: release
        env:
          # A manual run has to be started on the tag ref; any other ref fails
          # the vX.Y.Z check below.
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          commit="$(git rev-parse "refs/tags/$TAG^{commit}")"

          newest() {
            git tag --list "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1
          }
          floating=""
          [ "$(newest "v$major.$minor.*")" = "$TAG" ] && floating="$floating $major.$minor"
          [ "$(newest "v$major.*")" = "$TAG" ] && floating="$floating $major"
          [ "$(newest 'v*')" = "$TAG" ] && floating="$floating latest"
          floating="${floating# }"

          echo "Releasing $version from $commit; floating tags: ${floating:-none}"
          {
            echo "version=$version"
            echo "commit=$commit"
            echo "source=sha-${commit:0:7}"
            echo "floating=$floating"
          } >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # promote.yml and release-please both run on the push of the release
      # merge, and release-please's tag can start this workflow before promote
      # has added sha-<short>. Wait for it, then fail — never build. A missing
      # image means the release pull request skipped its build or promote
      # failed; either way there is no tested image to release.
      - name: Find the promoted image
        id: image
        env:
          SOURCE: ${{ steps.release.outputs.source }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 600))
          until digest="$(docker buildx imagetools inspect "$GAR:$SOURCE" \
                            --format '{{.Manifest.Digest}}' 2>/dev/null)"; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::$GAR:$SOURCE does not exist." \
                   "Check the promote.yml run for $COMMIT and the CI build on" \
                   "the release pull request. Nothing is built here." >&2
              exit 1
            fi
            echo "waiting for $SOURCE"
            sleep 15
          done
          echo "found $SOURCE at $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # By digest, not by the sha- tag, so the bytes that were looked up are the
      # bytes that get tagged. imagetools copies the manifest; the check after
      # it holds both registries to that digest. The version compiled in is the
      # one being released, because CI read it from the manifest on the release
      # pull request.
      - name: Publish the release tags
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FLOATING: ${{ steps.release.outputs.floating }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          for registry in "$GAR" "$HUB"; do
            args=(--tag "$registry:$VERSION")
            for tag in $FLOATING; do
              args+=(--tag "$registry:$tag")
            done
            # Same call across registries: it copies the blobs into Docker Hub
            # and pushes the identical manifest, so both serve one digest.
            docker buildx imagetools create "${args[@]}" "$GAR@$DIGEST"

            for tag in "$VERSION" $FLOATING; do
              got="$(docker buildx imagetools inspect "$registry:$tag" --format '{{.Manifest.Digest}}')"
              if [ "$got" != "$DIGEST" ]; then
                echo "::error::$registry:$tag is $got, expected $DIGEST." >&2
                exit 1
              fi
            done
          done

          echo "Promoted \`$DIGEST\` to \`$VERSION\` on both registries. Also tagged: ${FLOATING:-none}." >> "$GITHUB_STEP_SUMMARY"

      # release-please creates the Release and the tag in one call, so it should
      # exist already; the retry covers GitHub's eventual consistency. Everything
      # from the marker down is this workflow's, which keeps a re-run idempotent.
      - name: Attach the image digest to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          FLOATING: ${{ steps.release.outputs.floating }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if body="$(gh release view "$TAG" --json body --jq .body 2>/dev/null)"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::No GitHub Release for $TAG." >&2
              exit 1
            fi
            sleep 10
          done

          marker='<!-- release-images -->'
          notes="$RUNNER_TEMP/notes.md"
          {
            printf '%s\n' "$body" | sed "/^$marker\$/,\$d"
            echo "$marker"
            echo "## Images"
            echo
            echo "Built and tested on the release pull request, retagged here — not rebuilt."
            echo "Commit \`$COMMIT\`. Also tagged: ${FLOATING:-none (a newer release exists)}."
            echo
            echo "| Image | Digest |"
            echo "|---|---|"
            echo "| \`$GAR:$VERSION\` | \`$DIGEST\` |"
            echo "| \`$HUB:$VERSION\` | \`$DIGEST\` |"
          } > "$notes"

          gh release edit "$TAG" --notes-file "$notes"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
