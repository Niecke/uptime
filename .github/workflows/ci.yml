name: CI

# The only place an image is ever built. A pull request runs the suite and, if
# it passes, builds the image once and pushes it tagged with the head commit.
# Merging to main (promote.yml) and releasing a tag (release.yml) retag that
# exact digest, so the bytes that were tested are the bytes that get deployed.
#
# Only `pull_request`. Every push to a branch with an open pull request also
# fires `synchronize` on the same commit, so a push trigger would run all of
# this twice for one change. A push to main is a merge of a commit that was
# already tested here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GAR: europe-west3-docker.pkg.dev/niecke-it/niecke-it/uptime

jobs:
  # Deliberately a job-level `if:` on the jobs below rather than a `paths:`
  # filter on the trigger. A workflow skipped by path filtering never reports
  # its checks, so a required check in the ruleset would sit pending and the
  # pull request could never merge. A job skipped by `if:` reports a `skipped`
  # conclusion, which satisfies it.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Both ends of the range have to be in the clone to diff them.
          fetch-depth: 0

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code="$(.github/scripts/code-changed.sh "$BASE" "$HEAD" "$EVENT")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then
            echo "Code or image inputs changed — running the suite and building the image." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing that reaches the binary or the image changed — tests, build and release are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  # For a pull request `github.sha` is the ephemeral merge commit, which no
  # image may be tagged with: after the merge, promote.yml looks the image up by
  # the head sha that was tested.
  meta:
    name: Resolve build identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.id.outputs.commit }}
      tag: ${{ steps.id.outputs.tag }}
      app_version: ${{ steps.id.outputs.app_version }}
    steps:
      # The manifest as the PR head has it, not the merge commit: on the release
      # pull request that is the version it is about to tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: .release-please-manifest.json
          sparse-checkout-cone-mode: false

      # Images are built once, on the pull request, and promotion only retags
      # them — so the release pull request's image is the one that ships as that
      # release, and it carries the plain X.Y.Z. Every other build reports
      # `dev-<commit>`.
      - id: id
        env:
          HEAD_REF: ${{ github.head_ref }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=ci-${COMMIT:0:7}" >> "$GITHUB_OUTPUT"

          case "$HEAD_REF" in
            release-please--*) version="$(jq -r '."."' .release-please-manifest.json)" ;;
            *) version="dev-${COMMIT:0:7}" ;;
          esac
          echo "app_version=$version" >> "$GITHUB_OUTPUT"

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag. Tags are mutable: whoever controls
      # the action's repo can repoint v7 at new code and every consumer picks it up on the
      # next run. The trailing comment is what Renovate reads to keep the pin updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN behind in .git/config, where any later step —
          # or anything a build script pulls in — could read it.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Re-hashes every downloaded module and fails if it doesn't match go.sum.
      - name: Verify module checksums
        run: go mod verify

      # Fails if go.mod/go.sum are out of sync with the imports — the state in which an
      # unreviewed dependency could otherwise ride along unnoticed.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Run tests
        run: go test ./...

      # Checks the dependency tree against the Go vulnerability database. Reports only
      # vulnerabilities actually reachable from this module's code paths.
      - name: Scan dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  build:
    name: Build image
    needs: [changes, meta, tests]
    # A pull request from a fork has no access to the registry credentials, and
    # a manual run has no pull request head to tag an image with. Both stop at
    # the tests, and the merge then finds no image to promote.
    if: >-
      needs.changes.outputs.code == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The head commit itself, not the merge preview: this is the tree the
          # image is tagged after.
          ref: ${{ needs.meta.outputs.commit }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      # The version compiled in comes from the meta job: the manifest version on
      # the release pull request, `dev-<commit>` everywhere else. The digest
      # promoted to `0.1.8` therefore reports 0.1.8, because it was always going
      # to be 0.1.8. The git hash tells two builds of the same version apart.
      - name: Build and push
        env:
          COMMIT: ${{ needs.meta.outputs.commit }}
          TAG: ${{ needs.meta.outputs.tag }}
          VERSION: ${{ needs.meta.outputs.app_version }}
        run: |
          set -euo pipefail
          docker build \
            --build-arg BUILD_GIT_HASH="${COMMIT:0:7}" \
            --build-arg BUILD_VERSION="$VERSION" \
            -t "$GAR:$TAG" .
          docker push "$GAR:$TAG"

          {
            echo "Built \`$TAG\` from \`${COMMIT:0:7}\`, version \`$VERSION\`."
            echo ""
            echo "Merging retags this digest. Nothing downstream rebuilds it."
          } >> "$GITHUB_STEP_SUMMARY"
