name: Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - name: Build and push
        env:
          GAR: europe-west3-docker.pkg.dev/niecke-it/niecke-it/uptime
          # Pass context values through env rather than splicing ${{ }} straight into the
          # script body — an expression expanded into `run:` is a shell-injection sink.
          GIT_SHA: ${{ github.sha }}
        run: |
          docker build --build-arg BUILD_GIT_HASH="$(git rev-parse --short HEAD)" \
                       -t "$GAR:latest" \
                       -t "$GAR:$GIT_SHA" .
          docker push "$GAR:latest"
          docker push "$GAR:$GIT_SHA"
