name: Dev

# Merging to dev does not build anything. It retags the image the pull request
# already built and tested, so a dev deployment runs the exact digest CI ran.
#
# Artifact Registry only. Docker Hub is the public download and stays release
# only, so nobody can pull an unreleased build from it by accident.
on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

# Not cancellable: a run cut halfway through leaves some tags moved and others
# pointing at the previous digest.
concurrency:
  group: dev
  cancel-in-progress: false

env:
  GAR: europe-west3-docker.pkg.dev/niecke-it/niecke-it/uptime

jobs:
  promote:
    name: Retag the tested image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # version.sh counts commits since the last release tag to number this
          # build, and the image lookup may need the merge commit's parents.
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the version
        id: v
        run: .github/scripts/version.sh

      # VERSION still naming a version that shipped means the cycle was never
      # opened. Publishing anyway would tag 0.1.6-dev.3 as if it came before
      # 0.1.6, which it does not.
      - name: Refuse to publish against a released version
        env:
          RELEASED: ${{ steps.v.outputs.released }}
          FULL: ${{ steps.v.outputs.version }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "::error file=VERSION::v$FULL is already released." \
                 "Raise VERSION on dev to start the next cycle." >&2
            exit 1
          fi

      - name: Find the tested image
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(.github/scripts/source-tag.sh)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Looking for $GAR:$tag"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      # CI builds an image only when application code changed, so a pull request
      # touching just the README or compose.yml merges without ever producing
      # one. There is nothing to promote then, and nothing to redeploy either.
      #
      # A build that genuinely failed cannot reach here: it is a required check,
      # so the pull request would not have been mergeable.
      - name: Check the image exists
        id: image
        env:
          SRC: ${{ steps.source.outputs.tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$GAR:$SRC" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No image tagged \`$SRC\` — CI skipped the build because no application code changed. Nothing to promote." >> "$GITHUB_STEP_SUMMARY"
          fi

      # imagetools copies the manifest by digest: same bytes, extra tags. No
      # rebuild, so the binary keeps the git hash of the commit that was tested.
      - name: Retag as the pre-release
        if: steps.image.outputs.exists == 'true'
        env:
          SRC: ${{ steps.source.outputs.tag }}
          DEV_VERSION: ${{ steps.v.outputs.dev_version }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$GAR:$DEV_VERSION" \
            --tag "$GAR:dev" \
            "$GAR:$SRC"

          digest="$(docker buildx imagetools inspect "$GAR:$DEV_VERSION" --format '{{.Manifest.Digest}}')"
          {
            echo "Promoted \`$SRC\` to \`$DEV_VERSION\` and \`dev\`."
            echo ""
            echo "Digest \`$digest\`."
          } >> "$GITHUB_STEP_SUMMARY"
