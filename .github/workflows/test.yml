name: Test

# No `push:` trigger. While a pull request is open every push to its branch also
# fires `synchronize` on the same commit, so having both ran the whole suite
# twice for nothing. Pushes to dev and main reach these tests through the dev
# and release workflows, which call this one.
on:
  pull_request:
  workflow_call:
    outputs:
      code:
        description: "Whether this change can alter the binary or the image."
        value: ${{ jobs.changes.outputs.code }}

# Least privilege. Without this the job inherits the repository default, which on many
# repos is still read/write for the whole GITHUB_TOKEN. Nothing here needs to write.
permissions:
  contents: read

jobs:
  # Deliberately a job-level `if:` on the suite rather than a `paths:` filter on
  # the trigger. A workflow skipped by path filtering never reports its checks,
  # so a required check in the ruleset would sit pending and the pull request
  # could never merge. A job skipped by `if:` reports a `skipped` conclusion,
  # which satisfies it.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Both ends of the range have to be in the clone to diff them.
          fetch-depth: 0

      - id: filter
        env:
          # For a pull request these are the two tips of the range; for a push
          # they are the branch before and after. A manual run has neither, and
          # the script falls back to running everything.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          code="$(.github/scripts/code-changed.sh "$BASE" "$HEAD" "$EVENT")"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "true" ]; then
            echo "Code or image inputs changed — running the suite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing that reaches the binary or the image changed — tests, builds and releases are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit SHA, not a tag. Tags are mutable: whoever controls
      # the action's repo can repoint v7 at new code and every consumer picks it up on the
      # next run. The trailing comment is what Renovate reads to keep the pin updated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN behind in .git/config, where any later step —
          # or anything a build script pulls in — could read it.
          persist-credentials: false
          # Full history and tags: the version check below compares the VERSION
          # file against the newest release tag.
          fetch-depth: 0
          fetch-tags: true

      # Catches a malformed or stale VERSION on the pull request that introduced
      # it, rather than half way through a release build.
      - name: Validate VERSION
        run: .github/scripts/version.sh

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Re-hashes every downloaded module and fails if it doesn't match go.sum.
      - name: Verify module checksums
        run: go mod verify

      # Fails if go.mod/go.sum are out of sync with the imports — the state in which an
      # unreviewed dependency could otherwise ride along unnoticed.
      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Run tests
        run: go test ./...

      # Checks the dependency tree against the Go vulnerability database. Reports only
      # vulnerabilities actually reachable from this module's code paths.
      - name: Scan dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
