services:
  uptime:
    # Pinned by tag + digest. The tag documents the version for humans; the digest is
    # what Docker actually enforces, so a repushed tag can't swap the image underneath us.
    image: niecke11/uptime:0.1.7@sha256:ba6cfd0c1455c0d4bddb540cd622c3553f707cbfab87fa44e9fd02f209db1d1c
    restart: unless-stopped
    # Static binary running as nonroot on a high port — it needs no capabilities at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data:z
      - ./config.yml:/config.yml
    expose:
      - "3333"

  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
