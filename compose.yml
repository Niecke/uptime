services:
  uptime:
    # Pinned by tag + digest. The tag documents the version for humans; the digest is
    # what Docker actually enforces, so a repushed tag can't swap the image underneath us.
    image: niecke11/uptime:0.1.4@sha256:0f467119a7446c78eb2b50d87f7eadc036d1dfd3b10a95d23206a4f8dda9b95a
    restart: unless-stopped
    # Static binary running as nonroot on a high port — it needs no capabilities at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data:z
      - ./config.yml:/config.yml
    expose:
      - "3333"

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
