services:
  uptime:
    # Pinned by tag + digest. The tag documents the version for humans; the digest is
    # what Docker actually enforces, so a repushed tag can't swap the image underneath us.
    image: niecke11/uptime:0.2.0@sha256:995240ab00fc6d20cec0963c6941a8ab29550df95cb21638c0dbd94a75b2e63a
    restart: unless-stopped
    # Static binary running as nonroot on a high port — it needs no capabilities at all.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./data:/data:z
      - ./config.yml:/config.yml
    expose:
      - "3333"

  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
